session_name: okazii_v2

windows:
  - window_name: microservicii-licitatie
    layout: tiled
    panes:
      # Pane 1: Pregătire topicuri și pornire Bidder (prin Docker)
      - shell_command:
          - source .venv/bin/activate
          - python3 PrepareAuction.py
          - sleep 10  # Așteptăm ca topicurile să fie create
          - cd ../Bidder_Docker
          #- docker-compose up --build # Construiește și pornește containerul Bidder
          - docker-compose up  --build --scale bidder=10

      # Pane 2: Message Processor
      - shell_command:
          - source .venv/bin/activate
          - sleep 10  # Așteptăm ca totul să se inițializeze
          - python3 MessageProcessor.py


      # Pane 3: Bidding Processor
      - shell_command:
          - source .venv/bin/activate
          - sleep 10
          - python3 BiddingProcessor.py

      # Pane 4: Auctioneer Docker
      - shell_command:
          - cd ../Auctioneer_Docker
          - sleep 10
          #- docker-compose up --build
          - docker-compose up  --build  --scale auctioneer=1